name: Build ELPIPO Fixed 2 To 1

on:
  push:
    branches:
      - elpipo-v17-9-1-build
    paths:
      - elpipo_build/build_fixed_2_to_1.py
      - .github/workflows/build-elpipo-fixed-2-to-1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate files
        run: python elpipo_build/build_fixed_2_to_1.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elpipo_build/output/*.pine elpipo_build/output/*.txt
          git diff --cached --quiet || (git commit -m "Generate ELPIPO v17.9.1 fixed 2 to 1" && git push)
